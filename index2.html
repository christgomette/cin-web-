<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulaire de connexion</title>
    <link rel="stylesheet" href="style.css">
    <style>

        .formular {
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
        .box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 50px;
            height: 400px;
            padding: 5px;
            align-items: center;
            justify-content: center;
            width: 450px;
            
            border-radius: 4px;
            border: 1px solid #ccc;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .box h2 {
            margin-bottom: 10px;
        }

        .box button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
            

        .box button:hover {
            background-color: #45a049;
        }

        .box:hover {
            transform: scale(1.05);
            transition: transform 0.3s ease;
        }

        .form-control {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 250px;
        }

        .form-control:hover {
            border-color: #4CAF50;
            transition: border-color 0.3s ease;
            transform: scale(1.05);
            transition: transform 0.3s ease;
        }
    </style>
</head>

<body>

    <header>
        <nav class="navbar">
            
        <div class="lien">
            <a href="index.html" class="button">ciné web+</a>
            <div class="items">
            <a href="index2.html" class="liens">Connexion</a>
            <a href="index.html" class="liens">Accueil</a>
            <a href="#" class="liens">Contactez-nous</a>
            <a href="#" class="liens">A propos</a>
        </div>
        </div>
            
        </nav>
    </header>


    <div class="formular">
    <div class="box">
        <h2><Connecte-toi>Connectes-toi</Connecte-toi></h2>
        <input class="form-control" placeholder="Entrez votre email"></input>
        <input class="form-control" placeholder="Entrez votre mot de passe"></input>
        <button class="form-control">Connexion</button>
    </div>
</div>
</body>
</html>
